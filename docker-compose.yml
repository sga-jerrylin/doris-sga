# Apache Doris 4.0 Docker Compose 配置
# 简化版本：1 FE + 1 BE 用于开发测试

services:
  # Frontend (FE) - 元数据管理和查询协调
  doris-fe:
    image: apache/doris:fe-4.0.0
    container_name: doris-fe
    hostname: fe1
    restart: unless-stopped
    environment:
      - FE_SERVERS=fe1:172.28.0.2:9010
      - FE_ID=1
    ports:
      - "18030:8030"   # HTTP 端口 - Web UI
      - "19030:9030"   # MySQL 协议端口 - 客户端连接
      - "19010:9010"   # FE 内部通信端口
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log
    networks:
      doris-network:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/api/bootstrap"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Backend (BE) - 数据存储和查询执行
  doris-be:
    image: apache/doris:be-4.0.0
    container_name: doris-be
    hostname: doris-be
    restart: unless-stopped
    depends_on:
      doris-fe:
        condition: service_healthy
    environment:
      - FE_SERVERS=fe1:172.28.0.2:9010
      - BE_ADDR=172.28.0.3:9050
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    ports:
      - "18040:8040"   # BE HTTP 端口
      - "19050:9050"   # BE 心跳端口
      - "19060:9060"   # BE Thrift 端口
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log
    networks:
      doris-network:
        ipv4_address: 172.28.0.3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8040/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # API Gateway
  doris-api:
    build:
      context: ./tabsis-backend
      dockerfile: Dockerfile
    container_name: doris-api
    restart: unless-stopped
    ports:
      - "8018:8000"
    volumes:
      - doris-api-metadata:/app/data
    networks:
      - doris-network
    depends_on:
      doris-fe:
        condition: service_healthy
      doris-be:
        condition: service_healthy
    environment:
      - DORIS_HOST=fe1
      - DORIS_PORT=9030
      - DORIS_USER=root
      - DORIS_PASSWORD=
      - DORIS_DATABASE=doris_db
      - DORIS_STREAM_LOAD_HOST=doris-be
      - DORIS_STREAM_LOAD_PORT=8040
      - METADATA_DB_FILE=data/metadata.sqlite3
      - DEEPSEEK_API_KEY=sk-748638f482f74b7392a6dafd89bdd307
      - DEEPSEEK_MODEL=deepseek-chat
      - DEEPSEEK_BASE_URL=https://api.deepseek.com

  # Frontend Web UI
  doris-frontend:
    build:
      context: ./tabsis-frontend
      dockerfile: Dockerfile
    container_name: doris-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - doris-network
    depends_on:
      - doris-api

networks:
  doris-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.128/25
          gateway: 172.28.0.1

volumes:
  doris-fe-meta:
    driver: local
  doris-fe-log:
    driver: local
  doris-be-storage:
    driver: local
  doris-be-log:
    driver: local
  doris-api-metadata:
    driver: local
