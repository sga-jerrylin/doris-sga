<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试发票上传</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
        }
        h1 {
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="file"], input[type="number"], select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
        .result.success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }
        .result.error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }
        pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 测试发票上传功能</h1>
        <form id="uploadForm">
            <div class="form-group">
                <label for="file">选择 Excel 文件:</label>
                <input type="file" id="file" name="file" accept=".xlsx,.xls" required>
            </div>
            <div class="form-group">
                <label for="invoiceProjectId">发票项目 ID:</label>
                <input type="number" id="invoiceProjectId" name="invoiceProjectId" value="1" required>
            </div>
            <div class="form-group">
                <label for="direction">方向:</label>
                <select id="direction" name="direction" required>
                    <option value="sales">销项</option>
                    <option value="purchase">进项</option>
                </select>
            </div>
            <button type="submit" id="submitBtn">上传</button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');
            const fileInput = document.getElementById('file');
            const invoiceProjectId = document.getElementById('invoiceProjectId').value;
            const direction = document.getElementById('direction').value;

            if (!fileInput.files.length) {
                alert('请选择文件');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '上传中...';
            resultDiv.className = 'result';
            resultDiv.style.display = 'none';

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('invoice_project_id', invoiceProjectId);
            formData.append('direction', direction);

            try {
                const response = await fetch('http://localhost:8018/api/modules/invoice/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✓ 上传成功!</h3>
                        <p><strong>方向:</strong> ${data.direction}</p>
                        <p><strong>原始表名:</strong> ${data.raw_table_name}</p>
                        ${data.analysis && data.analysis.summary ? `
                            <p><strong>发票数量:</strong> ${data.analysis.summary[0]?.count || 0}</p>
                            <p><strong>总金额:</strong> ¥${(data.analysis.summary[0]?.total_amount || 0).toLocaleString('zh-CN', {minimumFractionDigits: 2})}</p>
                        ` : ''}
                        ${data.derived_tables ? `
                            <p><strong>衍生表:</strong></p>
                            <pre>${JSON.stringify(data.derived_tables, null, 2)}</pre>
                        ` : ''}
                        <p><strong>完整响应:</strong></p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>✗ 上传失败</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>✗ 发生错误</h3>
                    <p>${error.message}</p>
                `;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '上传';
            }
        });
    </script>
</body>
</html>
